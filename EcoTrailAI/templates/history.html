<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>History - EcoTrail AI</title>

  <link rel="stylesheet" href= "{{url_for('static',filename='style.css')}}" />
</head>

<body>

  <div class="dashboard-container">

    
    <div class="sidebar">
      <div class="logo">
        <img src="{{url_for('static',filename='image/logo.jpeg')}}" alt="logo">
        <h2>EcoTrail AI</h2>
      </div>

      <ul class="menu">
        <li><a href="/dashboard">Dashboard</a></li>
        <li><a href="/transport">Transport 🚗</a></li>
        <li><a href="/food-page">Food 🍔</a></li>
        <li><a href="/electricity">Energy 💡</a></li>
        <li class="active"><a href="/history">History 📜</a></li>
      </ul>

      <button class="logout-btn" onclick="logout()">Logout</button>
    </div>

    
    <div class="main-content">

      <div class="header">
        <h1>Carbon Footprint History</h1>
        <p>Track your past CO₂ emissions records 📊</p>
      </div>
      <div class="history-container">
        <h2>🚗Transport History</h2>
        <ul id="'transportHistoryList"></ul>

        <h2>🍔Food History</h2>
        <ul id="foodHistoryList"></ul>

        <h2>💡Electricity History</h2>
        <ul id="electricityHistoryList"></ul>

      </div>

      
      <div class="history-box">
        <table>
          <thead>
            <tr>
              <th>Date</th>
              <th>Vehicle CO₂</th>
              <th>Food CO₂</th>
              <th>Electricity CO₂</th>
              <th>Total CO₂</th>
              <th>Status</th>
            </tr>
          </thead>

          <tbody id="historyData">
            
          </tbody>
        </table>
      </div>

    </div>
  </div>

  <script src="{{url_for('static',filename='history.js')}}"></script>

  <script>
    function logout() {
      alert("Logged out successfully 🍀!");
      window.location.href = "index.html";
    }
  </script>

</body>
</html>
