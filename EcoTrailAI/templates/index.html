<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoTrail AI--Carbon Footprint Calculator</title>
    <link rel="stylesheet" href="{{ url_for('static',filename='style.css') }}">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
</head>
  <body class="index-body">

      <div class="container">
          <div class="form-box login">
             
                <form onsubmit="loginUser(event)">
                  <h1>Login</h1>
                  <div class="input-box">
                      <input type="text" id="username" placeholder="Username" required>
                      <i class='bx bxs-user'></i>
                  </div>
                  <div class="input-box">
                      <input type="password" placeholder="Password" required>
                      <i class='bx bxs-lock-alt' ></i>
                  </div>
                  <!-- <div class="forgot-link"> -->
                      <!-- <a href="#">Forgot Password?</a> -->
                  <!-- </div> -->
                  <button type="submit" class="btn">Login</button>
                   <p>Login to calculate and moniter your carbon footprint.</p>
              </form>
          </div>

          <div class="form-box register">
             
                <form onsubmit="registerUser(event)">
                  <h1>Registration</h1>
                  <div class="input-box">
                      <input type="text" placeholder="Username" required>
                      <i class='bx bxs-user'></i>
                  </div>
                  <div class="input-box">
                      <input type="email" placeholder="Email" required>
                      <i class='bx bxs-envelope' ></i>
                  </div>
                  <div class="input-box">
                      <input type="password" placeholder="Password" required>
                      <i class='bx bxs-lock-alt' ></i>
                  </div>
                  <button type="submit" class="btn">Register</button>
                  <p>Create an account and start reducing your emissions today.</p>
              </form>
          </div>

          <div class="toggle-box">
              <div class="toggle-panel toggle-left">
                  <h2>Start Your Green Journey!🌍</h2>
                  <p>Don't have an account?</p>
                  <button class="btn register-btn">Register</button>
              </div>

              <div class="toggle-panel toggle-right">
                  <h2>Join the Eco community!🌱</h2>
                  <p>Already have an account?</p>
                  <button class="btn login-btn">Login</button>
              </div>
          </div>
      </div>

      <script src="{{ url_for('static',filename='login.js') }}"></script>
  </body>
</html>
